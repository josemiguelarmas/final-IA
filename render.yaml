services:
  - type: web
    name: consultorio-mantis-ai
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        value: sqlite:////tmp/consultorio_juridico.db
      - key: FORCE_RULE_ENGINE
        value: "true"
      - key: MANTIS_ADAPTER_TYPE
        value: mock
